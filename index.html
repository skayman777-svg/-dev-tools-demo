<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dev Tools — Парсинг и Автоматизация</title>
<style>
    :root {
        --bg: #0a0b10;
        --panel: #13141f;
        --border: #232538;
        --text: #e2e4f0;
        --muted: #7b7f9e;
        --accent: #00f0ff;
        --purple: #b73cff;
        --green: #00ff66;
        --red: #ff3366;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    /* Шапка с вкладками */
    header {
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        padding: 0 24px;
        display: flex;
        align-items: center;
        gap: 32px;
        height: 64px;
    }
    .logo {
        font-weight: 700;
        font-size: 18px;
        color: #fff;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .logo span { color: var(--accent); }
    .tabs {
        display: flex;
        gap: 8px;
        height: 100%;
    }
    .tab {
        background: none;
        border: none;
        color: var(--muted);
        font-size: 14px;
        font-weight: 500;
        padding: 0 16px;
        cursor: pointer;
        position: relative;
        transition: color 0.2s;
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: #fff; }
    .tab.active::after {
        content: '';
        position: absolute;
        bottom: -1px;
        left: 0;
        width: 100%;
        height: 2px;
        background: var(--accent);
        box-shadow: 0 0 10px var(--accent);
    }

    /* Контент */
    main {
        flex: 1;
        padding: 24px;
        max-width: 1200px;
        margin: 0 auto;
        width: 100%;
        display: none;
    }
    main.active { display: block; }

    /* Вкладка 1: Парсинг */
    .parser-layout {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
        height: calc(100vh - 140px);
    }
    @media (max-width: 768px) { .parser-layout { grid-template-columns: 1fr; height: auto; } }
    
    .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }
    .panel-head {
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 13px;
        font-weight: 600;
        color: var(--muted);
    }
    
    /* Терминал */
    .terminal {
        flex: 1;
        padding: 16px;
        font-family: 'Courier New', monospace;
        font-size: 13px;
        line-height: 1.6;
        overflow-y: auto;
        color: #a8b3cf;
    }
    .terminal p { margin-bottom: 4px; }
    .log-ok { color: var(--green); }
    .log-info { color: var(--accent); }
    .log-warn { color: #ffcc00; }

    /* Кнопка и прогресс */
    .controls {
        padding: 16px;
        border-top: 1px solid var(--border);
        display: flex;
        gap: 12px;
        align-items: center;
    }
    .btn {
        background: var(--accent);
        color: #000;
        border: none;
        padding: 10px 24px;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.8; }
    .btn:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; }
    .progress-bar {
        flex: 1;
        height: 8px;
        background: var(--border);
        border-radius: 4px;
        overflow: hidden;
    }
    .progress-fill {
        height: 100%;
        width: 0%;
        background: var(--accent);
        transition: width 0.1s linear;
        box-shadow: 0 0 10px var(--accent);
    }

    /* Таблица */
    .table-wrap { flex: 1; overflow-y: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
    tr:hover td { background: rgba(255,255,255,0.02); }
    .status { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; background: rgba(0, 255, 102, 0.1); color: var(--green); }

    /* Вкладка 2: Автоматизация */
    .automation-canvas {
        position: relative;
        height: calc(100vh - 140px);
        background: radial-gradient(circle at center, #1a1c2e 0%, #0a0b10 100%);
        border: 1px solid var(--border);
        border-radius: 12px;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .node {
        position: absolute;
        width: 120px;
        height: 120px;
        background: var(--panel);
        border: 2px solid var(--border);
        border-radius: 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
        transition: all 0.3s;
        z-index: 2;
    }
    .node.active { border-color: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(183, 60, 255, 0.4); }
    .node.done { border-color: var(--green); color: #fff; box-shadow: 0 0 20px rgba(0, 255, 102, 0.4); }
    
    .node-icon { font-size: 28px; }
    
    /* Позиции нод */
    .node-1 { top: 20%; left: 15%; }
    .node-2 { top: 20%; right: 15%; }
    .node-3 { bottom: 20%; left: 15%; }
    .node-4 { bottom: 20%; right: 15%; }
    .node-center { top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100px; height: 100px; border-color: var(--accent); color: var(--accent); }
    .node-center.active { border-color: var(--accent); box-shadow: 0 0 30px rgba(0, 240, 255, 0.6); }

    /* SVG линии */
    svg.connections {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 1;
        pointer-events: none;
    }
    path { fill: none; stroke: var(--border); stroke-width: 2; }
    path.active { stroke: var(--accent); stroke-dasharray: 10; animation: dash 1s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -20; } }

    .run-btn-container {
        position: absolute;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
    }
    .automation-log {
        position: absolute;
        top: 24px; left: 24px;
        background: rgba(19, 20, 31, 0.8);
        backdrop-filter: blur(8px);
        border: 1px solid var(--border);
        padding: 12px 16px;
        border-radius: 8px;
        font-family: monospace;
        font-size: 12px;
        color: var(--accent);
        z-index: 10;
    }
</style>
</head>
<body>

<header>
    <div class="logo">⚡ <span>Dev</span>Tools</div>
    <div class="tabs">
        <button class="tab active" onclick="switchTab('parser')">Парсинг данных</button>
        <button class="tab" onclick="switchTab('automation')">AI-Автоматизация</button>
    </div>
</header>

<!-- ВКЛАДКА 1: ПАРСИНГ -->
<main id="tab-parser" class="active">
    <div class="parser-layout">
        <!-- Левая панель: Терминал -->
        <div class="panel">
            <div class="panel-head">Терминал (Логи)</div>
            <div class="terminal" id="terminal">
                <p class="log-info">[SYS] Система готова к запуску...</p>
                <p class="log-info">[SYS] Ожидание команды...</p>
            </div>
            <div class="controls">
                <button class="btn" id="startParseBtn" onclick="startParsing()">Запустить парсинг</button>
                <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
            </div>
        </div>

        <!-- Правая панель: Таблица -->
        <div class="panel">
            <div class="panel-head">Собранные данные</div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Артикул</th>
                            <th>Название</th>
                            <th>Цена</th>
                            <th>Статус</th>
                        </tr>
                    </thead>
                    <tbody id="dataTable">
                        <tr><td colspan="4" style="text-align:center; color:var(--muted); padding:32px;">Данных пока нет</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<!-- ВКЛАДКА 2: АВТОМАТИЗАЦИЯ -->
<main id="tab-automation">
    <div class="automation-canvas" id="canvas">
        <!-- Лог -->
        <div class="automation-log" id="autoLog">Ожидание запуска...</div>

        <!-- SVG Линии -->
        <svg class="connections">
            <!-- От центра к нодам и обратно (упрощенно) -->
            <path d="M 50% 50% L 15% 20%" id="p1" />
            <path d="M 50% 50% L 85% 20%" id="p2" />
            <path d="M 50% 50% L 15% 80%" id="p3" />
            <path d="M 50% 50% L 85% 80%" id="p4" />
        </svg>

        <!-- Ноды -->
        <div class="node node-1" id="n1"><div class="node-icon">📥</div>CRM Данные</div>
        <div class="node node-2" id="n2"><div class="node-icon">🤖</div>AI Обработка</div>
        <div class="node node-3" id="n3"><div class="node-icon">📊</div>Google Таблицы</div>
        <div class="node node-4" id="n4"><div class="node-icon">✈️</div>Telegram Bot</div>
        <div class="node node-center" id="nc"><div class="node-icon">⚙️</div>n8n Core</div>

        <!-- Кнопка -->
        <div class="run-btn-container">
            <button class="btn" id="runAutoBtn" onclick="runAutomation()">Запустить сценарий</button>
        </div>
    </div>
</main>

<script>
    // === ЛОГИКА ВКЛАДОК ===
    function switchTab(tabId) {
        document.querySelectorAll('main').forEach(m => m.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        
        document.getElementById('tab-' + tabId).classList.add('active');
        event.target.classList.add('active');
    }

    // === ЛОГИКА ПАРСИНГА ===
    let isParsing = false;
    const products = [
        {sku: 'WB-101', name: 'Умный унитаз Brunen', price: '123 400 ₽'},
        {sku: 'WB-102', name: 'Электронная крышка Daewon', price: '32 900 ₽'},
        {sku: 'OZ-201', name: 'Смеситель Grohe', price: '18 500 ₽'},
        {sku: 'WB-103', name: 'Инсталляция Geberit', price: '24 000 ₽'},
        {sku: 'YM-301', name: 'Полотенцесушитель', price: '8 900 ₽'},
        {sku: 'OZ-202', name: 'Раковина Cersanit', price: '12 300 ₽'},
        {sku: 'WB-104', name: 'Душевая кабина', price: '56 700 ₽'},
        {sku: 'YM-302', name: 'Зеркало с подсветкой', price: '7 400 ₽'}
    ];

    function log(msg, type = 'info') {
        const t = document.getElementById('terminal');
        const p = document.createElement('p');
        p.className = 'log-' + type;
        p.textContent = msg;
        t.appendChild(p);
        t.scrollTop = t.scrollHeight;
    }

    function startParsing() {
        if (isParsing) return;
        isParsing = true;
        
        const btn = document.getElementById('startParseBtn');
        const progress = document.getElementById('progressFill');
        const table = document.getElementById('dataTable');
        
        btn.disabled = true;
        btn.textContent = 'Парсинг...';
        table.innerHTML = '';
        progress.style.width = '0%';
        
        log('[INFO] Инициализация парсера...', 'info');
        log('[INFO] Подключение к маркетплейсам (WB, Ozon, Yandex)...', 'info');

        let currentItem = 0;
        
        const interval = setInterval(() => {
            // Обновляем прогресс
            const pct = Math.round(((currentItem + 1) / products.length) * 100);
            progress.style.width = pct + '%';

            // Пишем лог
            if (currentItem < products.length) {
                const p = products[currentItem];
                log(`[OK] Получен товар: ${p.sku} - ${p.name}`, 'ok');
                
                // Добавляем строку в таблицу
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="color:var(--muted)">${p.sku}</td>
                    <td>${p.name}</td>
                    <td style="color:var(--accent)">${p.price}</td>
                    <td><span class="status">Успешно</span></td>
                `;
                table.appendChild(tr);
                
                currentItem++;
            } else {
                // Завершение
                clearInterval(interval);
                log('[SYS] Парсинг завершен. Все данные сохранены.', 'ok');
                btn.disabled = false;
                btn.textContent = 'Запустить снова';
                isParsing = false;
            }
        }, 600); // Скорость появления строк (0.6 сек)
    }

    // === ЛОГИКА АВТОМАТИЗАЦИИ ===
    let isAutoRunning = false;

    function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function runAutomation() {
        if (isAutoRunning) return;
        isAutoRunning = true;
        
        const btn = document.getElementById('runAutoBtn');
        const logBox = document.getElementById('autoLog');
        const nodes = ['nc', 'n1', 'n2', 'n3', 'n4'].map(id => document.getElementById(id));
        const paths = ['p1', 'p2', 'p3', 'p4'].map(id => document.getElementById(id));
        
        // Сброс
        btn.disabled = true;
        btn.textContent = 'Выполняется...';
        nodes.forEach(n => n.className = n.className.replace(' active', '').replace(' done', ''));
        paths.forEach(p => p.classList.remove('active'));
        logBox.textContent = '🚀 Запуск рабочего процесса...';
        
        // 1. Ядро
        document.getElementById('nc').classList.add('active');
        await sleep(800);
        
        // 2. Обработка (параллельно для визуального эффекта)
        logBox.textContent = '⚙️ Ядро n8n распределяет задачи...';
        nodes.forEach(n => n.classList.add('active'));
        paths.forEach(p => p.classList.add('active'));
        await sleep(1500);
        
        // 3. Завершение
        logBox.textContent = '✅ Все узлы выполнили скрипты успешно!';
        nodes.forEach(n => { n.classList.remove('active'); n.classList.add('done'); });
        paths.forEach(p => p.classList.remove('active'));
        
        await sleep(2000);
        btn.disabled = false;
        btn.textContent = 'Запустить сценарий';
        logBox.textContent = 'Ожидание запуска...';
        nodes.forEach(n => n.classList.remove('done'));
        isAutoRunning = false;
    }
</script>
</body>
</html>
