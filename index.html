<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEXUS // System Interface</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #020205;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #ffffff;
            user-select: none;
        }

        /* 3D Канвас */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* UI Оверлей (как на PS5) */
        .ui-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none; /* Пропускает клики к 3D сцене */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
            box-sizing: border-box;
            background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.8) 100%);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            opacity: 0;
            animation: fadeIn 2s forwards 1s;
        }

        .logo {
            font-size: 14px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #00f0ff;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
            font-weight: 700;
        }

        .nav {
            display: flex;
            gap: 24px;
            font-size: 12px;
            letter-spacing: 1px;
            color: rgba(255,255,255,0.5);
            text-transform: uppercase;
        }

        .nav span:hover {
            color: #fff;
            cursor: pointer;
            pointer-events: auto;
        }

        .bottom-panel {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            opacity: 0;
            animation: fadeIn 2s forwards 1.5s;
        }

        .status-block {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .status-title {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.4);
        }

        .status-value {
            font-size: 24px;
            font-weight: 300;
            font-family: monospace;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-value::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00ff88;
            box-shadow: 0 0 15px #00ff88;
            animation: pulse 2s infinite;
        }

        .action-btn {
            pointer-events: auto;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            padding: 16px 40px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-radius: 40px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .action-btn:hover {
            background: rgba(0, 240, 255, 0.1);
            border-color: #00f0ff;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.2);
            text-shadow: 0 0 10px #00f0ff;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Загрузочный экран */
        #loader {
            position: fixed;
            inset: 0;
            background: #020205;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 1s;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 2px solid rgba(0,240,255,0.1);
            border-top-color: #00f0ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- Экран загрузки -->
    <div id="loader"><div class="spinner"></div></div>

    <!-- Слой с 3D графикой -->
    <div id="canvas-container"></div>

    <!-- Слой интерфейса -->
    <div class="ui-layer">
        <div class="header">
            <div class="logo">AERO // NEXUS</div>
            <div class="nav">
                <span>Dashboard</span>
                <span>Network</span>
                <span>Settings</span>
            </div>
        </div>

        <div class="bottom-panel">
            <div class="status-block">
                <div class="status-title">Core Status</div>
                <div class="status-value">ONLINE</div>
            </div>
            <button class="action-btn" onclick="triggerPulse()">Initialize Sequence</button>
        </div>
    </div>

    <!-- Подключение Three.js через CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // --- Настройка сцены ---
        const scene = new THREE.Scene();
        // Туман для глубины
        scene.fog = new THREE.FogExp2(0x020205, 0.03);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 30);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // --- Постобработка (Свечение / Bloom) ---
        const renderScene = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        bloomPass.threshold = 0.2;
        bloomPass.strength = 1.2; // Сила свечения
        bloomPass.radius = 0.5;

        const composer = new EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        // --- Свет ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.1);
        scene.add(ambientLight);

        const pointLight1 = new THREE.PointLight(0x00f0ff, 200, 100);
        pointLight1.position.set(10, 10, 10);
        scene.add(pointLight1);

        const pointLight2 = new THREE.PointLight(0xb73cff, 200, 100);
        pointLight2.position.set(-10, -10, 10);
        scene.add(pointLight2);

        // --- Создание 3D Объектов ---
        const group = new THREE.Group();
        scene.add(group);

        // Центральное ядро (Икосаэдр)
        const coreGeo = new THREE.IcosahedronGeometry(4, 2);
        const coreMat = new THREE.MeshStandardMaterial({
            color: 0x0a0a0a,
            emissive: 0x00f0ff,
            emissiveIntensity: 0.8,
            wireframe: true,
            transparent: true,
            opacity: 0.8
        });
        const core = new THREE.Mesh(coreGeo, coreMat);
        group.add(core);

        // Внутренняя сфера (сплошная, светящаяся)
        const innerGeo = new THREE.SphereGeometry(3.8, 32, 32);
        const innerMat = new THREE.MeshBasicMaterial({
            color: 0x00f0ff,
            transparent: true,
            opacity: 0.1,
            blending: THREE.AdditiveBlending
        });
        const innerSphere = new THREE.Mesh(innerGeo, innerMat);
        group.add(innerSphere);

        // Кольца
        const rings = [];
        const ringCount = 3;
        for (let i = 0; i < ringCount; i++) {
            const radius = 6 + i * 2.5;
            const tube = 0.05 + i * 0.02;
            const ringGeo = new THREE.TorusGeometry(radius, tube, 16, 100);
            
            const ringMat = new THREE.MeshStandardMaterial({
                color: i === 0 ? 0x00f0ff : (i === 1 ? 0xb73cff : 0xff3366),
                emissive: i === 0 ? 0x00f0ff : (i === 1 ? 0xb73cff : 0xff3366),
                emissiveIntensity: 2,
                transparent: true,
                opacity: 0.8
            });
            
            const ring = new THREE.Mesh(ringGeo, ringMat);
            
            // Случайный наклон колец
            ring.rotation.x = Math.PI / 2 + (Math.random() - 0.5) * 0.5;
            ring.rotation.y = (Math.random() - 0.5) * 0.5;
            
            group.add(ring);
            rings.push(ring);
        }

        // Частицы на фоне
        const particlesGeo = new THREE.BufferGeometry();
        const particlesCount = 1000;
        const posArray = new Float32Array(particlesCount * 3);
        for(let i = 0; i < particlesCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 100;
        }
        particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMat = new THREE.PointsMaterial({
            size: 0.1,
            color: 0x00f0ff,
            transparent: true,
            opacity: 0.6,
            blending: THREE.AdditiveBlending
        });
        const particlesMesh = new THREE.Points(particlesGeo, particlesMat);
        scene.add(particlesMesh);

        // --- Интерактивность (Мышь / Палец) ---
        let mouseX = 0;
        let mouseY = 0;
        let targetX = 0;
        let targetY = 0;

        const windowHalfX = window.innerWidth / 2;
        const windowHalfY = window.innerHeight / 2;

        document.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX - windowHalfX);
            mouseY = (event.clientY - windowHalfY);
        });

        document.addEventListener('touchmove', (event) => {
            if(event.touches.length > 0) {
                mouseX = (event.touches[0].clientX - windowHalfX);
                mouseY = (event.touches[0].clientY - windowHalfY);
            }
        });

        // --- Анимация ---
        const clock = new THREE.Clock();
        let pulseEffect = 0;

        // Функция для кнопки (вызывается из HTML)
        window.triggerPulse = () => {
            pulseEffect = 5; // Запускает резкое расширение
            // Меняем цвета
            pointLight1.color.setHex(0xff3366);
            pointLight2.color.setHex(0x00f0ff);
            setTimeout(() => {
                pointLight1.color.setHex(0x00f0ff);
                pointLight2.color.setHex(0xb73cff);
            }, 1000);
        };

        function animate() {
            requestAnimationFrame(animate);

            const time = clock.getElapsedTime();

            // Плавное движение камеры за мышью
            targetX = mouseX * 0.001;
            targetY = mouseY * 0.001;
            
            group.rotation.y += 0.002; // Автовращение
            group.rotation.y += 0.05 * (targetX - group.rotation.y); // Следование за мышью
            group.rotation.x += 0.05 * (targetY - group.rotation.x);

            // Вращение колец с разной скоростью
            rings.forEach((ring, index) => {
                ring.rotation.z += 0.005 * (index % 2 === 0 ? 1 : -1);
                ring.rotation.y += 0.002 * (index + 1);
            });

            // Пульсация ядра
            const scale = 1 + Math.sin(time * 2) * 0.02 + pulseEffect;
            core.scale.set(scale, scale, scale);
            innerSphere.scale.set(scale, scale, scale);

            // Затухание пульса
            if (pulseEffect > 0) {
                pulseEffect -= 0.05;
            }

            // Вращение частиц
            particlesMesh.rotation.y = time * 0.02;

            // Рендер через composer (для эффекта свечения)
            composer.render();
        }

        // Обработка ресайза
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        // Запуск
        animate();

        // Скрываем лоадер
        setTimeout(() => {
            const loader = document.getElementById('loader');
            loader.style.opacity = '0';
            setTimeout(() => loader.remove(), 1000);
        }, 1500);

    </script>
</body>
</html>
